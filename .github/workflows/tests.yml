# Testele automate: rulează la fiecare modificare a codului. Insigna verde din README arată că trec.
name: Teste

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalează dependențele
        run: pip install -r requirements.txt

      - name: Rulează testele (calcule, API, performanță cu 5 ani de date)
        env:
          TESTIFY_FISCAL_FEED: ""
        run: python -m pytest -q --ignore=tests/e2e

      - name: Verifică sintaxa interfeței (JavaScript)
        run: node --check app/static/app.js && node --check app/static/sw.js

  interfata:
    name: Teste de interfață (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalează dependențele și browserul
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Un browser apasă butoanele, ca Robert
        run: python -m pytest -q tests/e2e
