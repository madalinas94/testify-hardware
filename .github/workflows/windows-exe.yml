# Construiește programul Windows TestifyHardware.exe (nu are nevoie de Python instalat).
# Rezultatul se descarcă din tabul Actions → ultima rulare → „TestifyHardware-Windows”.
# La o versiune nouă (tag v1.0, v1.1 …) se publică automat și în Releases.
name: Program Windows (.exe)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalează dependențele
        run: pip install -r requirements.txt pyinstaller

      - name: Construiește TestifyHardware.exe
        run: pyinstaller -y --clean testify.spec

      - name: Verifică programul (pornește, răspunde, se oprește)
        shell: pwsh
        run: |
          $env:TESTIFY_NO_BROWSER = "1"
          $env:TESTIFY_PORT = "8123"
          $env:TESTIFY_FISCAL_FEED = ""
          $proc = Start-Process -FilePath "dist\TestifyHardware.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/auth/status" -TimeoutSec 3
              if ($r.company) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force
          if (-not $ok) { throw "Programul nu a pornit." }
          Write-Host "Programul a pornit corect: $($r.company)"

      - name: Pregătește arhiva
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\TestifyHardware.exe package\
          @"
          Testify Hardware - aplicatia pentru calculul lunar

          1. Copiati TestifyHardware.exe intr-un folder (de exemplu Documente\Testify).
          2. Dublu-click pe TestifyHardware.exe. Se deschide browserul cu aplicatia.
             Daca Windows afiseaza "Windows protected your PC", apasati "More info" -> "Run anyway"
             (programul nu este semnat digital, dar este construit public din codul de pe GitHub).
          3. Lasati deschisa fereastra neagra cat timp lucrati. Pentru oprire, inchideti-o.

          Datele (baza de date si copiile de siguranta zilnice) sunt in folderul TestifyData,
          langa program. Copiati-l pe un stick din cand in cand.
          De pe telefon: deschideti http://ADRESA-CALCULATORULUI:8000 in aceeasi retea Wi-Fi.
          "@ | Out-File -Encoding utf8 package\CITESTE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TestifyHardware-Windows
          path: package/
          retention-days: 30

      - name: Publică în Releases (doar pentru versiuni)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath TestifyHardware-Windows.zip
          gh release create $env:GITHUB_REF_NAME TestifyHardware-Windows.zip --title "Testify Hardware $env:GITHUB_REF_NAME" --notes "Descărcați arhiva, dezarhivați și porniți TestifyHardware.exe."
        env:
          GH_TOKEN: ${{ github.token }}
